version: 2
updates:
  # Maintain npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "gregpriday"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    # Group minor and patch updates together
    groups:
      development-dependencies:
        patterns:
          - "@babel/*"
          - "eslint*"
          - "jest*"
          - "@jest/*"
          - "babel-jest"
          - "prettier"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@babel/*"
          - "eslint*"
          - "jest*"
          - "@jest/*"
          - "babel-jest"
          - "prettier"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Jest 30.5's rewritten module system keeps the query string of a
      # `file://` dynamic import as part of the path, so the cache-busted import
      # of a legacy `~/.copytree/*.js` config fails with ENOENT under test while
      # working in Node. Held at 30.4 until a release fixes it.
      - dependency-name: "jest"
        versions: [">=30.5.0 <=30.5.2"]
      - dependency-name: "jest-diff"
        versions: [">=30.5.0 <=30.5.2"]
      - dependency-name: "@jest/globals"
        versions: [">=30.5.0 <=30.5.2"]
      - dependency-name: "babel-jest"
        versions: [">=30.5.0 <=30.5.2"]

  # Maintain GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci):"

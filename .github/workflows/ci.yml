name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          FORCE_COLOR: '0'
          NO_COLOR: '1'
          TZ: 'UTC'
          LANG: 'C'
          LC_ALL: 'C'

      - name: Type-check the declarations
        run: npm run typecheck

      - name: Check generated documentation for drift
        run: npm run docs:cli:check

      - name: Check for dead code and undeclared dependencies
        run: |
          npm run knip
          npm run knip:production

      # The published artifact, exercised the way a consumer would: installed
      # from the tarball with production dependencies only, imported by name.
      - name: Verify the packed package
        run: npm run test:package

      - name: Check for uncommitted golden file changes
        run: |
          if git diff --exit-code -- tests/fixtures/goldens; then
            echo "✅ No uncommitted golden file changes"
          else
            echo "❌ ERROR: Uncommitted golden file changes detected!"
            echo "Golden files were modified but not committed."
            echo "If these changes are intentional:"
            echo "  1. Run: UPDATE_GOLDEN=true npm run test:e2e"
            echo "  2. Review: git diff tests/fixtures/goldens/"
            echo "  3. Commit the updated golden files with explanation"
            exit 1
          fi

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@8cad3ba95e5920c42f44492e54bc9639cba47959 # v6.0.2
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e-cross-platform:
    name: E2E Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          FORCE_COLOR: '0'
          NO_COLOR: '1'
          TZ: 'UTC'
          LANG: 'C'
          LC_ALL: 'C'

      - name: Type-check the declarations
        run: npm run typecheck

      - name: Check generated documentation for drift
        run: npm run docs:cli:check

      - name: Check for dead code and undeclared dependencies
        run: |
          npm run knip
          npm run knip:production

      # The published artifact, exercised the way a consumer would: installed
      # from the tarball with production dependencies only, imported by name.
      - name: Verify the packed package
        run: npm run test:package

      - name: Check for uncommitted golden file changes
        shell: bash
        run: |
          if git diff --exit-code -- tests/fixtures/goldens; then
            echo "✅ No uncommitted golden file changes"
          else
            echo "::error::Uncommitted golden file changes detected! Run UPDATE_GOLDEN=true npm run test:e2e and commit the changes."
            exit 1
          fi

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for vulnerabilities
        run: npm audit --omit=dev --audit-level=high

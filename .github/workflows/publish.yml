name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One publish at a time. Two tag pushes in quick succession would otherwise race
# for the same registry state: both read `latest`, both decide a dist-tag from
# it, and the second overwrites the first's decision. `cancel-in-progress` is
# deliberately false — a half-finished publish must be allowed to finish and
# create its release rather than being killed between the two.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # One job, on purpose.
  #
  # This used to be three: quality checks, publish, and create-release — with
  # `create-release` depending on the *checks* rather than on the publish. A
  # failed or rejected publish therefore still produced a public GitHub release
  # announcing a version that did not exist on the registry, and the only way to
  # find out was for someone to try installing it.
  #
  # Splitting also meant the tarball was built twice: once implicitly by
  # `npm publish`, once never tested at all. Here the artifact is packed once,
  # verified, and that exact file is what gets published.
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Confirm the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
        id: version

      - name: Install from the lockfile
        run: npm ci

      # Pinned, not `@latest`. Publishing is the single most consequential
      # thing this repository does, and floating the tool that performs it means
      # every release depends on whatever npm shipped that morning. Raise this
      # deliberately, in a PR, having watched a release candidate go out on it.
      - name: Install the pinned npm for OIDC trusted publishing
        run: npm install -g npm@11.17.0

      # The complete gate: lint, formatting, generated-document drift,
      # documentation links, types, dead code, the full suite with coverage,
      # and the packed-tarball consumer tests.
      #
      # `--out` keeps the tarball those consumer tests ran against. Packing
      # again afterwards would produce a different file that nothing has
      # exercised — same inputs, but "probably identical" is not the claim this
      # job exists to make.
      - name: Verify the release
        run: |
          mkdir -p dist
          npm run lint
          npm run format:check
          npm run docs:cli:check
          npm run docs:links
          npm run typecheck
          npm run knip
          npm run knip:production
          npm run test:coverage
          node scripts/verify-package.js --out dist

      - name: Record the verified artifact
        id: pack
        run: |
          # `./dist/...`, not `dist/...`. `npm publish` runs its argument through
          # npm-package-arg, which reads a bare `a/b` as the GitHub shorthand
          # `owner/repo` — so `npm publish dist/copytree-1.0.0-rc.1.tgz` went
          # off to `git ls-remote ssh://git@github.com/dist/copytree-1.0.0-rc.1.tgz.git`
          # and died with a public-key error, having never looked at the
          # tarball sitting next to it. A leading `./` makes it a file spec.
          FILE="./$(ls dist/*.tgz)"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          # npm's own integrity format, so it can be compared against what the
          # registry reports after publication.
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$FILE" | base64 -w0 2>/dev/null || openssl dgst -sha512 -binary "$FILE" | base64)"
          echo "integrity=$INTEGRITY" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$FILE" | tee "$FILE.sha256"

      - name: Decide the dist-tag
        id: disttag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Whether this is a prerelease is decided by the same SemVer
          # implementation that decides the dist-tag, not by a shell glob. The
          # glob was `case "$VERSION" in *-*)`, which calls `1.2.3+build-7` a
          # prerelease: build metadata may legally contain a hyphen, so a
          # perfectly ordinary stable release would have gone out under `next`.
          # The exit code is checked explicitly rather than with a bare `if`:
          # 0 means prerelease, 1 means stable, and 2 means the version did not
          # parse at all. A bare `if` treats 2 the same as 1 and walks into the
          # stable branch, which is the one place a release decision must never
          # be made from an unrecognised string.
          set +e
          node scripts/dist-tag.js --is-prerelease "$VERSION"
          IS_PRERELEASE=$?
          set -e

          if [ "$IS_PRERELEASE" -eq 0 ]; then
              echo "tag=next" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_PRERELEASE" -ne 1 ]; then
              echo "::error::$VERSION is not a version this release process recognises"
              exit 1
          else
              # A registry lookup that *fails* must not read as "nothing is
              # published" — that would let a network blip move `latest`
              # backwards. Only a genuine 404 means the package is new;
              # anything else is an unknown, and an unknown is not a licence
              # to guess.
              if ! LATEST="$(npm view copytree version 2>/tmp/npmview.err)"; then
                if grep -q 'E404' /tmp/npmview.err; then
                  LATEST='0.0.0'
                else
                  echo "::error::Could not read the published version; refusing to guess a dist-tag"
                  cat /tmp/npmview.err
                  exit 1
                fi
              fi
              # `sort -V` used to decide this. GNU version sort is not SemVer:
              # it ranks `1.0.0-beta.1` above `1.0.0`, so the first stable
              # release would have gone out under `hotfix` while a beta kept
              # `latest`. `scripts/dist-tag.js` implements the real precedence
              # rules and is unit-tested against the cases that differ.
              TAG="$(node scripts/dist-tag.js "$VERSION" "$LATEST")"
              if [ "$TAG" = 'hotfix' ]; then
                echo "::warning::$VERSION does not exceed the published latest ($LATEST); publishing under the 'hotfix' tag"
              fi
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Publishes the exact file that was just packed and verified, rather than
      # re-packing from the working tree.
      # Idempotent: a rerun after a partial success (published, but the release
      # step failed) must be able to finish rather than dying on an immutable
      # version it already created.
      - name: Publish to npm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "copytree@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::copytree@$VERSION is already published; skipping publish and verifying instead"
            exit 0
          fi
          npm publish "${{ steps.pack.outputs.file }}" --access public --provenance --tag "${{ steps.disttag.outputs.tag }}"

      - name: Confirm the registry has the bytes we tested
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          EXPECTED="${{ steps.pack.outputs.integrity }}"

          for attempt in 1 2 3 4 5 6; do
            PUBLISHED="$(npm view "copytree@$VERSION" dist.integrity 2>/dev/null || true)"
            if [ -n "$PUBLISHED" ]; then
              # Existence is not enough. This is the assertion the whole
              # pack-once arrangement exists to make: the artifact on the
              # registry is the artifact the consumer tests passed against.
              if [ "$PUBLISHED" != "$EXPECTED" ]; then
                echo "::error::Registry integrity $PUBLISHED does not match the verified artifact $EXPECTED"
                exit 1
              fi
              echo "Registry reports $VERSION with matching integrity"
              exit 0
            fi
            echo "Not visible yet; retrying in 10s ($attempt/6)"
            sleep 10
          done
          echo "::error::copytree@$VERSION is not on the registry after publish"
          exit 1

      - name: Build the release notes
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%h)" HEAD > changelog.txt
          else
            git log --pretty=format:"- %s (%h)" "$PREV_TAG..HEAD" > changelog.txt
          fi
          {
            echo ""
            echo ""
            echo "### Artifact"
            echo ""
            echo '```'
            cat "${{ steps.pack.outputs.file }}.sha256"
            echo '```'
          } >> changelog.txt

      # Last, and only now: the release cannot exist unless the package does.
      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: changelog.txt
          files: |
            ${{ steps.pack.outputs.file }}
            ${{ steps.pack.outputs.file }}.sha256
          draft: false
          prerelease: ${{ steps.disttag.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
